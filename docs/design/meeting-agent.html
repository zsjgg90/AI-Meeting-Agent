<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Agent工具 - MeetMind AI</title>
<!-- Tailwind CSS -->
<script src="https://modao.cc/agent-py/static/source/js/tailwindcss.js"></script>
<!-- Iconify 图标 -->
<script src="https://modao.cc/agent-py/static/source/js/iconify-icon.min.js"></script>
<style>
        @font-face {
            font-family: 'PingFang SC';
            src: local('PingFang SC');
        }
        body {
            font-family: 'PingFang SC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .iphone-shell {
            width: 375px;
            height: 812px;
            box-shadow: 0 0 50px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="bg-gray-200 flex items-center justify-center min-h-screen">
<!-- 手机外壳容器 -->
<div class="iphone-shell bg-[#F5F7FA] overflow-hidden flex flex-col relative">
<!-- 1. 状态栏 -->
<div class="flex justify-between items-center px-6 pt-3 pb-2 text-[12px] font-bold">
<div>19:43</div>
<div class="flex items-center space-x-1.5">
<iconify-icon class="text-black" icon="mingcute:signal-line"></iconify-icon>
<iconify-icon class="text-black" icon="mingcute:wifi-line"></iconify-icon>
<div class="flex items-center bg-yellow-400 text-white px-1 rounded-sm text-[10px] scale-90">42</div>
</div>
</div>
<!-- 2. 标题与导航区 -->
<div class="flex items-center justify-between px-4 h-12 bg-[#F5F7FA]">
<button class="w-8 h-8 flex items-center justify-center rounded-full active:bg-gray-200 transition-colors">
<iconify-icon class="text-xl text-black" icon="mingcute:arrow-left-line"></iconify-icon>
</button>
<h1 class="text-[15px] font-bold truncate max-w-[200px]">团队会议：项目组-周进度同步</h1>
<div class="flex space-x-2">
<button class="w-8 h-8 flex items-center justify-center active:bg-gray-200 transition-colors">
<iconify-icon class="text-xl text-black" icon="mingcute:share-2-line"></iconify-icon>
</button>
<button class="w-8 h-8 flex items-center justify-center active:bg-gray-200 transition-colors">
<iconify-icon class="text-xl text-black" icon="mingcute:more-2-line"></iconify-icon>
</button>
</div>
</div>
<!-- 可滚动内容区 -->
<div class="flex-1 overflow-y-auto hide-scrollbar px-4 space-y-4 pb-10">
<!-- 3. 音频播放控制区 -->
<div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 mt-2">
<!-- 进度条 -->
<div class="flex items-center justify-between text-[11px] text-gray-400 mb-1">
<span>00:00</span>
<span>04:36</span>
</div>
<div class="relative w-full h-1 bg-gray-100 rounded-full mb-5">
<div class="absolute top-0 left-0 h-full w-[2px] bg-[#2B6CFF] rounded-full"></div>
<div class="absolute top-1/2 left-[2px] -translate-y-1/2 w-3 h-3 bg-white border-2 border-[#2B6CFF] rounded-full shadow-sm"></div>
</div>
<!-- 控制按钮 -->
<div class="flex items-center justify-center space-x-10">
<button class="w-10 h-10 flex items-center justify-center rounded-full border border-gray-200 text-gray-600 font-bold text-[14px]">15</button>
<button class="w-12 h-12 bg-black rounded-full flex items-center justify-center text-white shadow-md active:scale-95 transition-transform">
<iconify-icon class="text-2xl ml-1" icon="mingcute:play-fill"></iconify-icon>
</button>
<button class="w-10 h-10 flex items-center justify-center rounded-full border border-gray-200 text-gray-600 font-bold text-[14px]">15</button>
</div>
</div>
<!-- 4. 主标签栏 -->
<div class="bg-gray-200/50 p-1 rounded-xl flex items-center space-x-1">
<button class="flex-1 py-2 text-[13px] text-gray-500 rounded-lg">会议原文</button>
<button class="flex-1 py-2 text-[13px] text-gray-500 rounded-lg">AI纪要</button>
<button class="flex-1 py-2 text-[13px] text-[#2B6CFF] bg-white rounded-lg shadow-sm font-bold flex items-center justify-center space-x-1">
<iconify-icon icon="mingcute:lightning-fill"></iconify-icon>
<span>Agent工具</span>
</button>
</div>
<!-- 5. 智能生成模块 -->
<div class="space-y-3">
<div class="flex items-center space-x-2">
<div class="w-1 h-4 bg-[#2B6CFF] rounded-full"></div>
<h2 class="text-[16px] font-bold text-gray-800">智能工具</h2>
</div>
<!-- 2x2 网格 -->
<div class="grid grid-cols-2 gap-3">
<!-- 邮箱推送 -->
<div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-50 active:bg-gray-50 transition-colors cursor-pointer group">
<div class="w-10 h-10 bg-[#E8F0FE] text-[#2B6CFF] rounded-full flex items-center justify-center mb-3 group-active:scale-90 transition-transform">
<iconify-icon class="text-xl" icon="mingcute:mail-send-line"></iconify-icon>
</div>
<div class="text-[14px] font-bold text-gray-800 mb-0.5">邮箱推送</div>
<div class="text-[11px] text-gray-400">AI会议报告推送邮箱</div>
</div>
<!-- 飞书任务 -->
<div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-50 active:bg-gray-50 transition-colors cursor-pointer group">
<div class="w-10 h-10 bg-[#FFFBEB] text-[#F59E0B] rounded-full flex items-center justify-center mb-3 group-active:scale-90 transition-transform">
<iconify-icon class="text-xl" icon="mingcute:task-line"></iconify-icon>
</div>
<div class="text-[14px] font-bold text-gray-800 mb-0.5">飞书任务</div>
<div class="text-[11px] text-gray-400">待办任务推送到飞书</div>
</div>
<!-- 思维导图 -->
<div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-50 active:bg-gray-50 transition-colors cursor-pointer group">
<div class="w-10 h-10 bg-[#F5F3FF] text-[#8B5CF6] rounded-full flex items-center justify-center mb-3 group-active:scale-90 transition-transform">
<iconify-icon class="text-xl" icon="mingcute:mind-map-line"></iconify-icon>
</div>
<div class="text-[14px] font-bold text-gray-800 mb-0.5">思维导图</div>
<div class="text-[11px] text-gray-400">AI结构化思维导图</div>
</div>
<!-- 知识库 -->
<div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-50 active:bg-gray-50 transition-colors cursor-pointer group">
<div class="w-10 h-10 bg-[#ECFDF5] text-[#10B981] rounded-full flex items-center justify-center mb-3 group-active:scale-90 transition-transform">
<iconify-icon class="text-xl" icon="mingcute:book-2-line"></iconify-icon>
</div>
<div class="text-[14px] font-bold text-gray-800 mb-0.5">知识库</div>
<div class="text-[11px] text-gray-400">自动生成会议知识库</div>
</div>
</div>
<!-- 敬请期待 -->
<div class="bg-gray-100 rounded-2xl p-4 flex items-center justify-center space-x-2 border border-dashed border-gray-200">
<iconify-icon class="text-gray-400" icon="mingcute:dots-line"></iconify-icon>
<span class="text-[13px] text-gray-400">更多功能即将上线，敬请期待</span>
</div>
</div>
<!-- 6. 生成记录模块 -->
<div class="space-y-3 mt-6">
<div class="flex items-center justify-between">
<div class="flex items-center space-x-2">
<div class="w-1 h-4 bg-[#2B6CFF] rounded-full"></div>
<h2 class="text-[16px] font-bold text-gray-800">生成记录</h2>
</div>
<button class="text-[12px] text-gray-400 flex items-center">
                        全部 <iconify-icon class="ml-0.5" icon="mingcute:right-line"></iconify-icon>
</button>
</div>
<!-- 记录列表 -->
<div class="space-y-2">
<!-- 邮箱推送 -->
<div class="bg-white p-3 rounded-xl shadow-sm flex items-center justify-between border border-gray-50 active:bg-gray-50 transition-colors">
<div class="flex items-center space-x-3">
<div class="w-9 h-9 rounded-lg bg-[#E8F0FE] flex items-center justify-center">
<iconify-icon class="text-[#2B6CFF] text-lg" icon="mingcute:mail-send-line"></iconify-icon>
</div>
<div>
<div class="text-[13px] font-bold text-gray-800">邮箱推送</div>
<div class="text-[10px] text-gray-400">已推送到关联邮箱</div>
</div>
</div>
<button class="text-[12px] text-[#2B6CFF] font-medium">查看</button>
</div>
<!-- 飞书任务 -->
<div class="bg-white p-3 rounded-xl shadow-sm flex items-center justify-between border border-gray-50 active:bg-gray-50 transition-colors">
<div class="flex items-center space-x-3">
<div class="w-9 h-9 rounded-lg bg-[#FFFBEB] flex items-center justify-center">
<iconify-icon class="text-[#F59E0B] text-lg" icon="mingcute:task-line"></iconify-icon>
</div>
<div>
<div class="text-[13px] font-bold text-gray-800">飞书任务</div>
<div class="text-[10px] text-gray-400">已生成飞书待办任务</div>
</div>
</div>
<button class="text-[12px] text-[#2B6CFF] font-medium">查看</button>
</div>
</div>
</div>
</div>
<!-- 底部安全区 -->
<div class="h-8 bg-[#F5F7FA] flex-none">
<div class="w-32 h-1.5 bg-gray-300 rounded-full mx-auto mt-4"></div>
</div>
</div>
<script>
        // 模拟交互
        document.querySelectorAll('.active\\:bg-gray-50').forEach(card => {
            card.addEventListener('click', () => {
                const title = card.querySelector('.font-bold')?.innerText;
                if(title) console.log('触发生成：' + title);
            });
        });

        // 模拟播放按钮切换
        const playBtn = document.querySelector('.bg-black');
        if(playBtn) {
            let isPlaying = false;
            playBtn.addEventListener('click', () => {
                isPlaying = !isPlaying;
                const icon = playBtn.querySelector('iconify-icon');
                if(icon) icon.setAttribute('icon', isPlaying ? 'mingcute:pause-fill' : 'mingcute:play-fill');
            });
        }
    </script>
</body>
</html>
