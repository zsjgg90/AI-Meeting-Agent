        .iphone-container {
            max-width: 430px;

            background-color: #F5F7FA;
            min-height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;

        }

        .status-bar {

            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 600;
            background-color: transparent;
        }

        .nav-header {
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .task-card {
            background: white;
            border-radius: 24px;
            padding: 24px;
            margin: 0 16px 20px 16px;

        .detail-item {

        .detail-icon {

            font-size: 20px;
            margin-right: 12px;
            margin-top: 2px;
        }

        .date-btn {
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .date-btn-active {
            background-color: #EFF6FF;
            color: #2B6CFF;
        }

        .comment-item {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .avatar-circle {
            width: 36px;
            height: 36px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 14px;
            flex-shrink: 0;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 430px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(0,0,0,0.05);
            padding: 10px 20px 30px;
            display: flex;
            justify-content: space-between;
            z-index: 50;
        }

        .comment-input-area {
            position: fixed;
            bottom: 84px;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 430px;
            padding: 12px 16px;
            background: white;
            border-top: 1px solid #F1F5F9;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 40;
        }

        .file-item {
            display: flex;
            align-items: center;
            padding: 10px;
            background: #F8FAFC;
            border-radius: 12px;
            margin-top: 8px;
        }
    </style>
</head>

<script>
    // 简单的交互反馈
    document.querySelectorAll('.date-btn').forEach(btn => {
        btn.onclick = function() {
            document.querySelectorAll('.date-btn').forEach(b => {
                b.classList.remove('date-btn-active', 'bg-[#EFF6FF]', 'text-[#2B6CFF]');
                b.classList.add('bg-gray-100', 'text-gray-600');
            });
            this.classList.add('date-btn-active', 'bg-[#EFF6FF]', 'text-[#2B6CFF]');
            this.classList.remove('bg-gray-100', 'text-gray-600');
        };
    });
</script>
