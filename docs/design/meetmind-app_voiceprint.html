<!DOCTYPE html>

<html class="" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>声纹管理 - MeetMind</title>
<!-- Tailwind CSS -->
<script src="https://modao.cc/agent-py/static/source/js/tailwindcss.js"></script>
<!-- Iconify 图标 -->
<script src="https://modao.cc/agent-py/static/source/js/iconify-icon.min.js"></script>
<style>
        body {
            font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .phone-container {
            width: 375px;
            height: 812px;
            background-color: #F5F7FA;
            border-radius: 40px;
            border: 8px solid #000;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
        }

        /* 隐藏滚动条 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .glass-nav {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }

        /* Toggle Switch Style */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #2B6CFF;
            background-color: #2B6CFF;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #2B6CFF;
        }

        .voiceprint-list.disabled {
            opacity: 0.4;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body class="is-mb-ai-setting" style="opacity: 1;">
<div class="phone-container">
<!-- 状态栏 -->
<div class="flex justify-between items-center px-8 pt-4 pb-2 text-[14px] font-semibold text-black shrink-0">
<div>01:38</div>
<div class="flex items-center gap-1.5">
<iconify-icon icon="lucide:signal" width="16"></iconify-icon>
<iconify-icon icon="lucide:wifi" width="16"></iconify-icon>
<div class="flex items-center gap-0.5 border border-black/20 rounded-[4px] px-0.5 py-0.25">
<div class="w-4 h-2 bg-black rounded-[1px]"></div>
</div>
<span class="text-[11px] ml-[-2px]">59</span>
</div>
</div>
<!-- 页面头部 -->
<div class="flex justify-between items-center px-6 py-4 shrink-0">
<a class="flex items-center justify-center w-8 h-8" href="https://modao.cc/agent-py/workspace/6a6744aaf8f228217e57242f/meetmind-app.html/profile.html?render_html=true">
<iconify-icon class="text-black" icon="lucide:chevron-left" width="24"></iconify-icon>
</a>
<h1 class="text-[18px] font-bold text-black">声纹管理</h1>
<a class="flex items-center justify-center w-8 h-8" href="https://modao.cc/agent-py/workspace/6a6744aaf8f228217e57242f/meetmind-app.html/add-voiceprint.html?render_html=true">
<iconify-icon class="text-black" icon="lucide:plus" width="24"></iconify-icon>
</a>
</div>
<!-- 内容区域 -->
<div class="flex-1 min-h-0 overflow-y-auto no-scrollbar px-4 pb-6">
<!-- 声纹识别开关 -->
<div class="bg-white rounded-2xl shadow-sm mb-4 p-4">
<div class="flex justify-between items-center">
<div class="flex items-center">
<iconify-icon class="text-[#2B6CFF] mr-3" icon="lucide:scan-face" width="20"></iconify-icon>
<span class="text-[15px] font-medium text-black">声纹识别</span>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" id="voiceprintToggle" type="checkbox"/>
<div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-[#2B6CFF]"></div>
</label>
</div>
<div class="mt-2 text-[12px] text-gray-400">
                    开启后，系统将自动识别并标注不同说话人
                </div>
</div>
<!-- 已注册声纹列表 -->
<div class="bg-white rounded-2xl shadow-sm overflow-hidden voiceprint-list" id="voiceprintList">
<!-- 条目 1 -->
<div class="flex items-center p-4">
<div class="w-10 h-10 rounded-full bg-[#2B6CFF] flex items-center justify-center text-white font-bold shrink-0">张</div>
<div class="ml-3 flex-1">
<div class="text-[16px] font-bold text-black name-label">张明</div>
<div class="text-[12px] text-gray-400">已录入语音样本</div>
</div>
<div class="bg-green-50 text-green-500 text-[11px] px-2 py-0.5 rounded-full font-medium cursor-pointer active:opacity-70 transition-opacity" onclick="openEditModal(this)" style="color: rgb(0, 0, 0);">编辑</div>
</div>
<div class="h-[1px] bg-gray-50 mx-4"></div>
<!-- 条目 2 -->
<div class="flex items-center p-4">
<div class="w-10 h-10 rounded-full bg-[#FF8C00] flex items-center justify-center text-white font-bold shrink-0">李</div>
<div class="ml-3 flex-1">
<div class="text-[16px] font-bold text-black name-label">李华</div>
<div class="text-[12px] text-gray-400">已录入语音样本</div>
</div>
<div class="bg-green-50 text-green-500 text-[11px] px-2 py-0.5 rounded-full font-medium cursor-pointer active:opacity-70 transition-opacity" onclick="openEditModal(this)" style="color: rgb(27, 27, 27);">编辑</div>
</div>
<div class="h-[1px] bg-gray-50 mx-4"></div>
<!-- 条目 3 -->
<div class="flex items-center p-4">
<div class="w-10 h-10 rounded-full bg-[#10B981] flex items-center justify-center text-white font-bold shrink-0">王</div>
<div class="ml-3 flex-1">
<div class="text-[16px] font-bold text-black name-label">王芳</div>
<div class="text-[12px] text-gray-400">已录入语音样本</div>
</div>
<div class="bg-gray-100 text-gray-400 text-[11px] px-2 py-0.5 rounded-full font-medium cursor-pointer active:opacity-70 transition-opacity" onclick="openEditModal(this)" style="color: rgb(19, 19, 19);">编辑</div>
</div>
</div>
<!-- 底部添加按钮 -->
<div class="mt-8 flex justify-center">
<a class="w-full h-12 bg-[#2B6CFF] text-white rounded-xl flex items-center justify-center font-bold text-[15px] shadow-lg shadow-blue-100 active:scale-95 transition-transform" href="#">
<svg class="mr-1" height="18" style="" viewbox="0 0 32 32" width="18" xmlns="http://www.w3.org/2000/svg"><path d="M16 22c3.4 0 6-2.6 6-6v-8c0-3.4-2.6-6-6-6s-6 2.6-6 6v8c0 3.4 2.6 6 6 6zM16 4.2c2.4 0 4.4 2 4.4 4.4v2.6h-2v-2.6c0-1.4-1-2.4-2.4-2.4v-2z" fill="currentColor" stroke="none"></path><path d="M24 14v2c0 4.4-3.6 8-8 8s-8-3.6-8-8v-2h-2v2c0 5.2 4 9.4 9 9.8v2.2h-5v2h12v-2h-5v-2.2c5-0.4 9-4.6 9-9.8v-2h-2z" fill="currentColor" stroke="none"></path></svg>录入声纹样本
                </a>
</div>
</div>
<!-- 底部导航栏 -->
</div>
<!-- 编辑姓名 Modal -->
<div class="fixed inset-0 bg-black/50 hidden items-center justify-center z-[100] px-6" id="editNameModal">
<div class="bg-white w-full max-w-sm rounded-3xl overflow-hidden shadow-2xl transform transition-all">
<div class="p-6">
<h3 class="text-[18px] font-bold text-black mb-4 text-center">编辑姓名</h3>
<div class="relative">
<input class="w-full h-12 bg-gray-50 border border-gray-200 rounded-xl px-4 text-[16px] outline-none focus:border-[#2B6CFF] transition-colors" id="editNameInput" placeholder="请输入姓名" type="text"/>
</div>
</div>
<div class="flex border-t border-gray-100">
<button class="flex-1 h-14 text-gray-400 font-medium text-[16px] active:bg-gray-50" onclick="closeEditModal()">取消</button>
<div class="w-[1px] bg-gray-100 h-14"></div>
<button class="flex-1 h-14 text-[#2B6CFF] font-bold text-[16px] active:bg-gray-50" onclick="saveName()">保存</button>
</div>
</div>
</div>
<script>
let currentEditingElement = null;

function openEditModal(btn) {
    const container = btn.closest('.flex.items-center');
    const nameElement = container.querySelector('.name-label');
    currentEditingElement = nameElement;
    document.getElementById('editNameInput').value = nameElement.innerText;
    const modal = document.getElementById('editNameModal');
    modal.classList.remove('hidden');
    modal.classList.add('flex');
}

function closeEditModal() {
    const modal = document.getElementById('editNameModal');
    modal.classList.add('hidden');
    modal.classList.remove('flex');
}

function saveName() {
    const newName = document.getElementById('editNameInput').value;
    if (newName.trim() !== '') {
        if (currentEditingElement) {
            currentEditingElement.innerText = newName;
            // 同时更新头像中的文字（取首字符）
            const container = currentEditingElement.closest('.flex.items-center');
            const avatar = container.querySelector('.shrink-0');
            if (avatar) {
                avatar.innerText = newName.charAt(0);
            }
        }
        closeEditModal();
    }
}

document.addEventListener('DOMContentLoaded', function() {
    const toggle = document.getElementById('voiceprintToggle');
    const list = document.getElementById('voiceprintList');
    
    function updateListState() {
        if (toggle.checked) {
            list.classList.remove('disabled');
        } else {
            list.classList.add('disabled');
        }
    }
    
    if(toggle) {
        toggle.addEventListener('change', updateListState);
        updateListState(); // 初始化状态
    }
});
</script>
</body></html>
