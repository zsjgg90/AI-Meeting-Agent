            gap: 12px;
            z-index: 40;
        }

        .file-item {

            align-items: center;
            padding: 10px;
            background: #F8FAFC;
            border-radius: 12px;
            margin-top: 8px;
        }
    </style>
</head>

<script>
    // 简单的交互反馈
    document.querySelectorAll('.date-btn').forEach(btn => {
        btn.onclick = function() {
            document.querySelectorAll('.date-btn').forEach(b => {
                b.classList.remove('date-btn-active', 'bg-[#EFF6FF]', 'text-[#2B6CFF]');
                b.classList.add('bg-gray-100', 'text-gray-600');
            });
            this.classList.add('date-btn-active', 'bg-[#EFF6FF]', 'text-[#2B6CFF]');
            this.classList.remove('bg-gray-100', 'text-gray-600');
        };
    });

    function toggleTask(event, checkboxContainer) {
        event.preventDefault();
        event.stopPropagation();
        
        const icon = checkboxContainer.querySelector('iconify-icon');
        const title = checkboxContainer.nextElementSibling.querySelector('h3');
        const isCompleted = icon.getAttribute('icon') === 'lucide:check-circle-2';
        
        if (isCompleted) {
            icon.setAttribute('icon', 'lucide:circle');
            checkboxContainer.classList.remove('text-[#10B981]');
            checkboxContainer.classList.add('text-gray-300');
            title.classList.remove('line-through', 'text-gray-400');
            title.classList.add('text-gray-900');
        } else {
            icon.setAttribute('icon', 'lucide:check-circle-2');
            checkboxContainer.classList.remove('text-gray-300');
            checkboxContainer.classList.add('text-[#10B981]');
            title.classList.add('line-through', 'text-gray-400');
            title.classList.remove('text-gray-900');
        }
    }
</script>
